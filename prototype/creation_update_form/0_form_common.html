<html class="fixed">

<head>
	<style>
		/* Target: <label class="... control-label-sm"> form field labels across all sections */
		.control-label-sm {
			font-size: smaller;
		}

		/* Target: Select2 single/multi-select selection box, selected choice tags, inline search input, and dropdown options to match .form-control-sm font size */
		.select2-container--bootstrap .select2-selection,
		.select2-container--bootstrap .select2-selection--multiple .select2-selection__choice,
		.select2-container--bootstrap .select2-selection--multiple .select2-search--inline .select2-search__field,
		.select2-container--bootstrap .select2-results__option {
			font-size: x-small;
		}

		/* Target: Select2 single-select container height and padding to match compact .form-control-sm inputs (26px) */
		.select2-container--bootstrap .select2-selection--single {
			height: 26px;
			line-height: 1.3;
			padding: 4px 24px 4px 10px;
		}

		/* Target: Select2 multi-select container height to match compact .form-control-sm inputs (26px) */
		.select2-container--bootstrap .select2-selection--multiple {
			min-height: 26px;
			height: auto;
		}

		/* Target: Select2 multi-select rendered list line-height reset */
		.select2-container--bootstrap .select2-selection--multiple .select2-selection__rendered {
			line-height: 1.3;
		}

		/* Target: Select2 multi-select selected choice tags vertical margins to center inside 26px container */
		.select2-container--bootstrap .select2-selection--multiple .select2-selection__choice {
			margin: 3px 0 2px 5px;
		}

		/* Target: Select2 multi-select inline search input height and width so it does not stretch or wrap the container */
		.select2-container--bootstrap .select2-selection--multiple .select2-search--inline .select2-search__field {
			height: 22px;
			line-height: 1.3;
			padding: 0 6px;
			min-width: 2em;
		}

		/* Target: <span class="input-group-text input-group-addon-sm"> prepend/append icons and text in input groups (e.g., date range calendar icon and "to" separator) */
		.input-group-addon-sm {
			font-size: xx-small;
		}

		/* Target: <label> elements inside <div class="checkbox-custom"> */
		.checkbox-custom label {
			font-size: smaller;
		}

		/* Target: <p class="... char-limit-indicator"> maximum character counter text below <input> and <textarea> fields */
		.char-limit-indicator {
			font-size: smaller;
		}

		/* Target: <img class="uploaded-image-preview"> image preview element displayed below file upload controls */
		.uploaded-image-preview {
			width: inherit;
			height: 25em;
		}

		/* Target: <label class="... field-helper-desc"> read-only long description text below an <input> or <select> field */
		.field-helper-desc {
			color: green;
			font-size: smaller;
		}

		/* Target: <span class="badge ... section-col-badge"> column header badges in matrix layouts and item header badges in carousels */
		.section-col-badge {
			font-size: larger;
			width: 95%;
		}

		/* Target: <div class="owl-nav"> navigation arrow container in <div class="owl-carousel"> */
		.owl-carousel .owl-nav {
			top: -2.1rem !important;
			font-size: xxx-large !important;
			color: brown;
			width: 5rem;
			right: 0;
		}

		/* Target: <button class="owl-prev"> and <button class="owl-next"> carousel navigation buttons (base transition) */
		.owl-carousel .owl-nav button.owl-prev,
		.owl-carousel .owl-nav button.owl-next {
			transition: transform 0.15s ease-in-out !important;
		}

		/* Target: active (non-disabled) <button class="owl-prev"> and <button class="owl-next"> on hover/focus */
		.owl-carousel .owl-nav button.owl-prev:not(.disabled):hover,
		.owl-carousel .owl-nav button.owl-next:not(.disabled):hover,
		.owl-carousel .owl-nav button.owl-prev:not(.disabled):focus,
		.owl-carousel .owl-nav button.owl-next:not(.disabled):focus {
			background: transparent !important;
			color: brown !important;
			transform: scale(1.5);
			outline: none;
		}

		/* Target: disabled <button class="owl-prev disabled"> and <button class="owl-next disabled"> */
		.owl-carousel .owl-nav button.owl-prev.disabled,
		.owl-carousel .owl-nav button.owl-next.disabled {
			background: transparent !important;
			color: brown !important;
			opacity: 0.5 !important;
			transform: none !important;
			pointer-events: none !important;
			cursor: default !important;
		}

		/* Target: <div class="... beautify-scroll"> scrollable containers in left accordion panels (logs, timeline, errors) */
		.beautify-scroll {
			overflow-y: auto !important;
			overflow-x: hidden !important;
			scrollbar-width: thin;
			scrollbar-color: #adb5bd #f1f1f1;
		}

		/* Target: WebKit scrollbar dimensions for .beautify-scroll containers */
		.beautify-scroll::-webkit-scrollbar {
			width: 6px;
			height: 6px;
		}

		/* Target: WebKit scrollbar track for .beautify-scroll containers */
		.beautify-scroll::-webkit-scrollbar-track {
			background: #f1f1f1;
			border-radius: 4px;
		}

		/* Target: WebKit scrollbar thumb for .beautify-scroll containers */
		.beautify-scroll::-webkit-scrollbar-thumb {
			background-color: #adb5bd;
			border-radius: 4px;
		}

		/* Target: WebKit scrollbar thumb on hover for .beautify-scroll containers */
		.beautify-scroll::-webkit-scrollbar-thumb:hover {
			background-color: #6c757d;
		}

		/* Target: <button class="... btn-go"> floating "Go" action button for update/correction requests */
		.btn-go {
			position: absolute;
			opacity: 0.6;
			display: 'none';
			z-index: 999999;
		}

		/* Target: <button class="... btn-go go-std-field"> "Go" button positioned over standard inputs, selects, and tables */
		.go-std-field {
			top: -4px;
			right: 0;
			height: 100%;
			width: 30%;
		}

		/* Target: <button class="... btn-go go-chk-field"> "Go" button positioned over <div class="checkbox-custom"> elements */
		.go-chk-field {
			top: -8px;
			left: -8px;
			height: inherit;
			width: inherit;
		}

		/* Target: form controls (<input>, <select>, <textarea>) marked as changed or with an active update request */
		.changed {
			border: 3px solid darkorange;
		}

		/* Target: form controls (<input>, <select>, <textarea>) approved at Level 1 */
		.approvedL1 {
			border: 3px solid darkgreen;
		}

		/* Target: form controls (<input>, <select>, <textarea>) approved at Level 2 */
		.approvedL2 {
			border: 3px solid darkblue;
		}

		/* Target: form controls (<input>, <select>, <textarea>) with a rejected update request */
		.rejected {
			border: 3px solid darkred;
		}
	</style>
	<script>
		// Add a 'focus' event listener to each input text and text are 
		// toselect all text when focused 
		$('input[type="text"],textarea').each(function () {
			$(this).on('focus', function () {
				this.select();
			});
		});
	</script>
</head>
