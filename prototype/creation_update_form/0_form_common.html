<html class="fixed">

<head>
	<style>
		/** All form labels - reduce font size */
		.control-label-sm {
			font-size: smaller;
		}

		/** Input group prepend/append icon and texts */
		.input-group-aux {
			font-size: xx-small;
		}

		/** Reduce font size for checkboxes with labels on the right */
		.checkbox-custom label {
			font-size: smaller;
		}

		/** Character max length indicator for input text fields and areas */
		.c-indicator {
			font-size: smaller;
		}

		/** for image display after it is uploaded */
		.image-uploaded {
			width: inherit;
			height: 25em;
		}

		/** for large texts related to descriptions for a field */
		.txt-large-desc {
			color: green;
			font-size: smaller;
		}

		/** for badges on top in the matrix layout */
		.sBadge {
			font-size: larger;
			width: 95%;
		}

		/* Carousel Navigation Overrides */
		.owl-carousel .owl-nav {
			top: -2.1rem !important;
			font-size: xxx-large !important;
			color: brown;
			width: 5rem;
			right: 0;
		}

		/* Base transition to handle smooth scaling */
		.owl-carousel .owl-nav button.owl-prev,
		.owl-carousel .owl-nav button.owl-next {
			transition: transform 0.15s ease-in-out !important;
		}

		/* Hover/Focus effect (enlarge arrow, prevent background color) ONLY for active buttons */
		.owl-carousel .owl-nav button.owl-prev:not(.disabled):hover,
		.owl-carousel .owl-nav button.owl-next:not(.disabled):hover,
		.owl-carousel .owl-nav button.owl-prev:not(.disabled):focus,
		.owl-carousel .owl-nav button.owl-next:not(.disabled):focus {
			background: transparent !important;
			color: brown !important;
			transform: scale(1.5);
			outline: none;
		}

		/* Ensure disabled buttons strictly maintain their appearance with zero interactive effects */
		.owl-carousel .owl-nav button.owl-prev.disabled,
		.owl-carousel .owl-nav button.owl-next.disabled {
			background: transparent !important;
			color: brown !important;
			opacity: 0.5 !important;
			transform: none !important;
			pointer-events: none !important;
			cursor: default !important;
		}
	</style>
	<script>
		// Add a 'focus' event listener to each input text and text are 
		// toselect all text when focused 
		$('input[type="text"],textarea').each(function () {
			$(this).on('focus', function () {
				this.select();
			});
		});
	</script>
</head>
