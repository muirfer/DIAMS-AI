<!-- Start - Subpanel - Basic Data -->
<div id="section1" class="row">
	<div class="col-lg-12">
		<section class="card card-transparent mb-4">
			<header class="card-header pb-0">
				<h2 class="card-title">Basic data</h2>
				<p class="card-subtitle"></p>
			</header>
			<div class="card-body">
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Brand:</label>
					<div class="col-sm-5">
						<input type="text" name="brand" class="form-control form-control-sm" autocomplete="off"
							autocorrect="off" spellcheck="false">
					</div>
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Sub-Brand:</label>
					<div class="col-sm-5">
						<input type="text" name="sbrand" class="form-control form-control-sm" autocomplete="off"
							autocorrect="off" spellcheck="false" value="Plant-Based">
					</div>
				</div>
				<div class="row">
					<hr class="col-lg-9 offset-lg-1 dotted mt-1 mb-2">
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Product type:</label>
					<div class="col-sm-5">
						<select class="form-control form-control-sm mb-0">
							<option value=""></option>
							<option value="ZIBG">ZIBG - Operating supplies</option>
							<option value="ZDIF">ZDIF - Free Display</option>
							<option value="ZFRI">ZFRI - Perishables Retail</option>
							<option value="ZIEN" selected>ZIEN</option>
							<option value="ZVEF">ZVEF - Free Packaging MD</option>
							<option value="ZDIS">ZDIS - Display</option>
							<option value="ZHAW">ZHAW - Trading Goods Retail</option>
							<option value="ZVER">ZVER - Packaging MD</option>
							<option value="ZLGU">ZLGU - Tied Empties</option>
							<option value="ZIBF">ZIBF - Free Operating supplies</option>
							<option value="ZLGO">ZLGO - Tied Empties GOLD</option>
							<option value="ZVOL">ZVOL - Full products</option>
							<option value="ZHAF">ZHAF - Free Trading Goods Retail
							</option>
						</select>
					</div>
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Product nature:</label>
					<div class="col-sm-5">
						<input type="text" name="brand" class="form-control form-control-sm" autocomplete="off"
							autocorrect="off" spellcheck="false">
					</div>
				</div>
				<div class="row">
					<hr class="col-lg-9 offset-lg-1 dotted mt-1 mb-2">
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Net
						contents of Base UoM: </label>
					<div class="col-sm-5">
						<input type="text" name="ncobuom" class="form-control form-control-sm text-right"
							autocomplete="off" autocorrect="off" spellcheck="false">
					</div>
					<div class="col-sm-3">
						<select class="form-control form-control-sm mb-0">
							<option value=""></option>
							<option value="L">L - Liter</option>
							<option value="CTL">CL - Centiliter</option>
							<option value="ML" selected>ML - Milliliter</option>
							<option value="G">G - Gram</option>
							<option value="KG">KG - Kilogram</option>
						</select>
					</div>
				</div>
				<div class="row">
					<hr class="col-lg-9 offset-lg-1 dotted mt-1 mb-2">
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Country
						of origin of the product: </label>
					<div class="col-sm-5">
						<select class="form-control form-control-sm mb-0">
							<option value="AF">AF - Afghanistan</option>
							<option value="AL">AL - Albania</option>
							<option value="AD">AD - Andorra</option>
							<option value="AO">AO - Angola</option>
							<option value="BE">BE - Belgium</option>
							<option value="BR">BR - Brazil</option>
							<option value="BA">BA - Bahamas</option>
							<option value="BD">BD - Bangladesh</option>
							<option value="CA">CA - Canada</option>
							<option value="CN">CN - China</option>
							<option value="CO">CO - Colombia</option>
							<option value="CU">CU - Cuba</option>
							<option value="DE" selected>DE - Germany</option>
							<option value="DK">DK - Denmark</option>
							<option value="DO">DO - Dominican Republic</option>
							<option value="DJ">DJ - Djibouti</option>
							<option value="ES">ES - Spain</option>
							<option value="EG">EG - Egypt</option>
							<option value="EC">EC - Ecuador</option>
							<option value="EE">EE - Estonia</option>
							<option value="FR">FR - France</option>
							<option value="FI">FI - Finland</option>
							<option value="FJ">FJ - Fiji</option>
							<option value="FM">FM - Micronesia (Federated States of)
							</option>
						</select>
					</div>
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Country
						of import: </label>
					<div class="col-sm-5">
						<select class="form-control form-control-sm mb-0">
							<option value="AF">AF - Afghanistan</option>
							<option value="AL">AL - Albania</option>
							<option value="AD">AD - Andorra</option>
							<option value="AO">AO - Angola</option>
							<option value="BE">BE - Belgium</option>
							<option value="BR">BR - Brazil</option>
							<option value="BA">BA - Bahamas</option>
							<option value="BD" selected>BD - Bangladesh</option>
							<option value="CA">CA - Canada</option>
							<option value="CN">CN - China</option>
							<option value="CO">CO - Colombia</option>
							<option value="CU">CU - Cuba</option>
							<option value="DE">DE - Germany</option>
							<option value="DK">DK - Denmark</option>
							<option value="DO">DO - Dominican Republic</option>
							<option value="DJ">DJ - Djibouti</option>
							<option value="ES">ES - Spain</option>
							<option value="EG">EG - Egypt</option>
							<option value="EC">EC - Ecuador</option>
							<option value="EE">EE - Estonia</option>
							<option value="FR">FR - France</option>
							<option value="FI">FI - Finland</option>
							<option value="FJ">FJ - Fiji</option>
							<option value="FM">FM - Micronesia (Federated States of)
							</option>
						</select>
					</div>
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Product creation date:
					</label>
					<div class="col-sm-5">
						<div class="input-group">
							<span class="input-group-prepend">
								<span class="input-group-text">
									<i class="fas fa-calendar-alt"></i>
								</span>
							</span>
							<input type="text" data-plugin-datepicker data-plugin-options='{ "format": "dd/mm/yyyy" }'
								class="form-control dateInput text-center" autocomplete="off" value="07/05/2024">
						</div>
					</div>
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">For sale:
					</label>
					<div class="col-sm-5">
						<div class="input-daterange input-group" data-plugin-datepicker=""
							data-plugin-options='{ "format": "dd/mm/yyyy" }'>
							<span class="input-group-prepend">
								<span class="input-group-text input-group-aux" tabindex="-1">
									<i class="fas fa-calendar-alt"></i>
								</span>
							</span>
							<input type="text" class="form-control form-control-sm" name="start" value="15/02/2024">
							<span class="input-group-text input-group-aux border-left-0 border-right-0 rounded-0">
								to
							</span>
							<input type="text" class="form-control form-control-sm" name="end" value="31/12/9999">
						</div>
					</div>
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Original
						introduction week: </label>
					<div class="col-sm-5">
						<select class="form-control form-control-sm mb-0">
							<option class="optionToChange" value=""></option>
							<option value="W48 - 24/11/2022">W56 - 20/11/2024</option>
							<option value="W48 - 24/11/2022">W57 - 25/12/2024</option>
							<option value="W48 - 24/11/2022">W58 - 26/01/2025</option>
							<option value="W48 - 24/11/2022" selected>W59 - 27/02/2025
							</option>
							<option value="W48 - 24/11/2022">W60 - 28/03/2025</option>
							<option value="W48 - 24/11/2022">W61 - 26/04/2025</option>
							<option value="W48 - 24/11/2022">W62 - 25/05/2025</option>
							<option value="W48 - 24/11/2022">W63 - 23/06/2025</option>
						</select>
					</div>
				</div>
				<div class="row">
					<hr class="col-lg-9 offset-lg-1 dotted mt-1 mb-2">
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Reporting
						indicator</label>
					<div class="col-sm-5">
						<select class="form-control form-control-sm mb-0">
							<option class="" value=""></option>
							<option value="ig">Imported goods</option>
							<option value="dg">Domestic goods</option>
						</select>
					</div>
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">CSE:
					</label>
					<div class="col-sm-5">
						<div class="checkbox-custom">
							<input type="checkbox" checked="">
							<label></label>
						</div>
					</div>
				</div>
				<div class="row">
					<hr class="col-lg-9 offset-lg-1 dotted mt-1 mb-2">
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Delisted
						product: </label>
					<div class="col-sm-5">
						<input type="text" name="dprod" class="form-control form-control-sm" autocomplete="off"
							autocorrect="off" spellcheck="false">
						<div class="row">
							<div class="col-lg-12">
								<label class="col-form-label txt-large-desc pt-0">Delisted product
									description</label>
							</div>
						</div>
					</div>
					<div class="col-sm-3">
						<div class="checkbox-custom">
							<input type="checkbox" id="checkboxExample2" disabled>
							<label for="checkboxExample2">Not needed</label>
						</div>
					</div>
				</div>
				<div class="row">
					<hr class="col-lg-9 offset-lg-1 dotted mt-1 mb-2">
				</div>
				<div class="row">
					<label class="col-sm-3 control-label control-label-sm text-sm-right pt-1">Product status: </label>
					<div class="col-sm-5">
						<select class="form-control form-control-sm mb-0">
							<option value=""></option>
							<option>0Y - DLL Technical block</option>
							<option>0N - DLL Hope Id block</option>
							<option>10 - DLL in creation</option>
							<option>20 - DLL only sales</option>
							<option selected>21 - DLL store ord. block</option>
							<option>50 - DLL full block</option>
							<option>70 - DLL full active</option>
							<option>75 - DLL full active-order lim</option>
							<option>80 - DLL missing today</option>
							<option>90 - DLL temporary block</option>
							<option>99 - DLL vendor ord. block</option>
						</select>
					</div>
				</div>
			</div>
		</section>
	</div>
</div>
